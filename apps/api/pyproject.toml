[project]
name = "aidahos-api"
version = "0.0.0"
description = "AidaHOS integration layer — PMS (MSSQL), MikroTik, FreeRADIUS over Tailscale"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = false
